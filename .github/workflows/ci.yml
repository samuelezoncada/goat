name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # macOS ships a BSD ctags that can't parse our flags; all platforms
      # need universal-ctags so TestCtagsLive runs for real.
      - name: Install universal-ctags
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) sudo apt-get update && sudo apt-get install -y universal-ctags ;;
            macOS) brew install universal-ctags ;;
            Windows) choco install universal-ctags -y ;;
          esac
      - name: Format check
        shell: bash
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # The editor runs a background highlighter and background symbol lookups,
      # so the race detector is where concurrency bugs would show up.
      - name: Test (race)
        run: go test -race ./...
      - name: Build
        run: go build ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fuzz buffer edits (short)
        run: go test ./editor/ -run FuzzBufferEdits -fuzz FuzzBufferEdits -fuzztime 60s
