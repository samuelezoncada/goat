name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # macOS ships a BSD ctags that can't parse our flags; all platforms
      # need universal-ctags so TestCtagsLive runs for real.
      - name: Install universal-ctags
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) sudo apt-get update && sudo apt-get install -y universal-ctags ;;
            macOS) brew install universal-ctags ;;
            Windows) choco install universal-ctags -y ;;
          esac
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
